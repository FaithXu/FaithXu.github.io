<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>隔着</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #06060a;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #fff;
  }
  canvas { display: block; }

  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  #instructions {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 20px 30px;
    opacity: 1;
    transition: opacity 4s ease;
  }
  #instructions.fade { opacity: 0; }

  .player-hint {
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
  }
  .player-hint.left { color: rgba(160,200,255,0.25); }
  .player-hint.right { color: rgba(255,200,160,0.25); }

  #center-label {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 11px;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.08);
    text-transform: uppercase;
    pointer-events: none;
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }

  #bottom-hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.12);
    pointer-events: none;
    text-transform: uppercase;
    transition: opacity 3s ease;
  }

  #title-screen {
    position: fixed;
    inset: 0;
    background: #06060a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
    cursor: pointer;
    transition: opacity 2.5s ease;
  }
  #title-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #title-screen h1 {
    font-size: 28px;
    font-weight: normal;
    letter-spacing: 12px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 8px;
  }
  #title-screen p {
    font-size: 10px;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.2);
    text-transform: uppercase;
  }
  #title-screen .byline {
    margin-top: 40px;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.1);
  }
</style>
</head>
<body>

<div id="title-screen">
  <h1>隔 着</h1>
  <p>点击开始</p>
  <p class="byline">两个玩家 · 两个方向 · 隔着窗</p>
</div>

<canvas id="canvas"></canvas>

<div id="ui">
  <div id="instructions">
    <span class="player-hint left">← → ↑ ↓ 移动 &nbsp; 空格 推送</span>
    <span class="player-hint right">W A S D 移动 &nbsp; L 推送</span>
  </div>
  <div id="center-label">窗</div>
  <div id="bottom-hint">有些东西推过去，你不会知道对方有没有收到</div>
</div>

<script>
// ─── Canvas ───
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => {
  resize();
  initPositions();
});
resize();

const CX = () => W / 2;
const CY = () => H / 2;
const WIN_W = () => Math.min(W * 0.08, 8);
const WIN_Y_TOP = () => H * 0.2;
const WIN_Y_BOT = () => H * 0.8;

function initPositions() {
  // Left hand starts left-center
  leftHand.x = W * 0.25;
  leftHand.y = H * 0.5;
  rightHand.x = W * 0.75;
  rightHand.y = H * 0.5;
}

// ─── Audio ───
let audioCtx = null;
let reverbNode = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Simple reverb
  reverbNode = audioCtx.createConvolver();
  const irLen = audioCtx.sampleRate * 2;
  const ir = audioCtx.createBuffer(2, irLen, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < irLen; i++)
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 3);
  }
  reverbNode.buffer = ir;
  reverbNode.connect(audioCtx.destination);
}

function playTone(freq, duration, vol = 0.18, type = 'sine') {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(reverbNode);
  osc.start();
  osc.stop(audioCtx.currentTime + duration + 0.1);
}

// Ambient drone
let droneOsc = null, droneGain = null;
function startDrone() {
  if (droneOsc) return;
  droneOsc = audioCtx.createOscillator();
  droneGain = audioCtx.createGain();
  droneOsc.type = 'sine';
  droneOsc.frequency.value = 55; // A1
  droneGain.gain.value = 0.04;
  droneOsc.connect(droneGain);
  droneGain.connect(reverbNode);
  droneOsc.start();
}

// ─── Hands ───
const HAND_W = 18;
const HAND_H = 22;

function makeHand(x, y, side) {
  return {
    x, y,
    side, // 'left' or 'right'
    vx: 0,
    vy: 0,
    held: null,    // object being held
    pushing: false,
    pushTimer: 0,
    bobPhase: Math.random() * Math.PI * 2,
  };
}

let leftHand = makeHand(W * 0.25, H * 0.5, 'left');
let rightHand = makeHand(W * 0.75, H * 0.5, 'right');

// ─── Objects (things that can be pushed) ───
const objects = [];
const MAX_OBJECTS = 3;

function spawnObject(side) {
  if (objects.length >= MAX_OBJECTS) return;
  const o = {
    id: Math.random(),
    x: side === 'left' ? W * 0.1 + Math.random() * W * 0.15 : W * 0.75 + Math.random() * W * 0.15,
    y: H * 0.3 + Math.random() * H * 0.4,
    vx: 0, vy: 0,
    side,
    state: 'resting', // resting | held | crossing | arrived | lost | received
    crossProgress: 0,
    crossFromX: 0, crossToX: 0,
    crossFromY: 0, crossToY: 0,
    arrivalTime: 0,
    arrivedOpacity: 0,
    pulse: Math.random() * Math.PI * 2,
    hue: Math.random() * 360,
  };
  objects.push(o);
}

// Initial objects
setTimeout(() => spawnObject('left'), 1000);
setTimeout(() => spawnObject('right'), 2500);
setTimeout(() => spawnObject('left'), 5000);
setTimeout(() => spawnObject('right'), 8000);

// ─── Keys ───
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── Window particles (dust motes) ───
const motes = [];
for (let i = 0; i < 30; i++) {
  motes.push({
    x: Math.random() * 20 - 10,
    y: Math.random() * H,
    r: 0.5 + Math.random() * 1.5,
    speed: 0.1 + Math.random() * 0.3,
    opacity: 0.1 + Math.random() * 0.2,
  });
}

// ─── Floating words ───
const whispers = [
  '你收到了吗',
  '收到了',
  '还在吗',
  '在',
  '这个给你',
  '嗯',
  '谢谢',
  '保重',
];
let whisperTimer = 0;
let nextWhisperTime = 5000;
const activeWhispers = [];

function maybeAddWhisper() {
  if (activeWhispers.length >= 2) return;
  const text = whispers[Math.floor(Math.random() * whispers.length)];
  activeWhispers.push({
    text,
    x: CX() + (Math.random() - 0.5) * 60,
    y: CY() + (Math.random() - 0.5) * 80,
    opacity: 0,
    maxOpacity: 0.12 + Math.random() * 0.1,
    life: 0,
    maxLife: 3000 + Math.random() * 2000,
  });
}

function updateWhispers(dt) {
  whisperTimer += dt;
  if (whisperTimer > nextWhisperTime) {
    maybeAddWhisper();
    whisperTimer = 0;
    nextWhisperTime = 6000 + Math.random() * 8000;
  }
  for (let i = activeWhispers.length - 1; i >= 0; i--) {
    const w = activeWhispers[i];
    w.life += dt;
    const fadeIn = w.life < 1000 ? w.life / 1000 : 1;
    const fadeOut = w.life > w.maxLife - 1500 ? (w.maxLife - w.life) / 1500 : 1;
    w.opacity = w.maxOpacity * Math.min(fadeIn, fadeOut);
    if (w.life >= w.maxLife) activeWhispers.splice(i, 1);
  }
}

// ─── Update ───
function update(dt, t) {
  // Left hand controls: ← → ↑ ↓ 移动, 空格 推送
  const lspd = 3;
  if (keys['ArrowLeft']) leftHand.vx = -lspd;
  else if (keys['ArrowRight']) leftHand.vx = lspd;
  else leftHand.vx *= 0.85;

  if (keys['ArrowUp']) leftHand.vy = -lspd;
  else if (keys['ArrowDown']) leftHand.vy = lspd;
  else leftHand.vy *= 0.85;

  // Right hand controls: W A S D 移动, L 推送
  const rspd = 3;
  if (keys['KeyA']) rightHand.vx = -rspd;
  else if (keys['KeyD']) rightHand.vx = rspd;
  else rightHand.vx *= 0.85;

  if (keys['KeyW']) rightHand.vy = -rspd;
  else if (keys['KeyS']) rightHand.vy = rspd;
  else rightHand.vy *= 0.85;

  // Apply movement with bounds
  for (const hand of [leftHand, rightHand]) {
    const margin = WIN_W() / 2 + HAND_W;
    const topMargin = WIN_Y_TOP() + HAND_H;
    const botMargin = WIN_Y_BOT() - HAND_H;

    if (hand.side === 'left') {
      hand.x = Math.max(margin, Math.min(CX() - margin, hand.x + hand.vx));
    } else {
      hand.x = Math.max(CX() + margin, Math.min(W - margin, hand.x + hand.vx));
    }
    hand.y = Math.max(topMargin, Math.min(botMargin, hand.y + hand.vy));
    hand.bobPhase += 0.03;
  }

  // Push action
  for (const hand of [leftHand, rightHand]) {
    const pushKey = hand.side === 'left' ? 'Space' : 'KeyL';
    if (keys[pushKey] && !hand.pushing) {
      // Try to grab nearest resting object on this side
      if (!hand.held) {
        const nearest = objects.find(o =>
          o.state === 'resting' &&
          o.side === hand.side &&
          dist(hand.x, hand.y, o.x, o.y) < 60
        );
        if (nearest) {
          hand.held = nearest;
          nearest.state = 'held';
          playTone(220 + Math.random() * 40, 0.5, 0.1, 'sine');
        } else {
          // No held object — try to push back any arrived/crossing object on this side
          const target = objects.find(o =>
            (o.state === 'arrived' || o.state === 'resting') &&
            o.side === hand.side &&
            dist(hand.x, hand.y, o.x, o.y) < 70
          );
          if (target) {
            target.state = 'crossing';
            target.crossFromX = target.x;
            target.crossFromY = target.y;
            target.crossToX = hand.side === 'left' ? W * 0.85 : W * 0.15;
            target.crossToY = CY() + (Math.random() - 0.5) * 100;
            target.crossProgress = 0;
            target.crossSide = hand.side;
            hand.pushing = true;
            hand.pushTimer = 400;
            playTone(165, 0.4, 0.12, 'triangle');
          }
        }
      } else {
        // Push held object toward center
        const obj = hand.held;
        obj.state = 'crossing';
        obj.crossFromX = hand.x;
        obj.crossFromY = hand.y;
        obj.crossToX = CX() + (hand.side === 'left' ? 30 : -30);
        obj.crossToY = CY() + (Math.random() - 0.5) * 100;
        obj.crossProgress = 0;
        obj.crossSide = hand.side;
        hand.held = null;
        hand.pushing = true;
        hand.pushTimer = 400;
        playTone(180, 0.3, 0.15, 'triangle');
      }
    }
    if (hand.pushTimer > 0) {
      hand.pushTimer -= dt;
      if (hand.pushTimer <= 0) hand.pushing = false;
    }
  }

  // Update objects
  for (const obj of objects) {
    obj.pulse += 0.04;

    if (obj.state === 'held') {
      obj.x = (obj.side === 'left' ? leftHand : rightHand).x;
      obj.y = (obj.side === 'left' ? leftHand : rightHand).y - HAND_H / 2;
    }

    if (obj.state === 'crossing') {
      obj.crossProgress += 0.008;
      const ease = easeInOut(obj.crossProgress);
      obj.x = lerp(obj.crossFromX, obj.crossToX, ease);
      obj.y = lerp(obj.crossFromY, obj.crossToY, ease);

      if (obj.crossProgress >= 1) {
        // Window crossing — fate uncertain
        const roll = Math.random();
        if (roll < 0.55) {
          // Arrives on other side
          obj.state = 'arrived';
          obj.side = obj.crossSide === 'left' ? 'right' : 'left';
          obj.x = obj.side === 'left' ? W * 0.25 : W * 0.75;
          obj.y = CY() + (Math.random() - 0.5) * H * 0.3;
          obj.arrivalTime = t;
          obj.arrivedOpacity = 1;
          playTone(330 + Math.random() * 20, 1.2, 0.12, 'sine');
          maybeAddWhisper();
        } else if (roll < 0.75) {
          // Gets lost — fades near window
          obj.state = 'lost';
          obj.x = CX();
          obj.y = CY() + (Math.random() - 0.5) * 120;
          obj.life = 1;
          playTone(110, 1.5, 0.08, 'sine');
        } else {
          // Returns — comes back to sender
          obj.state = 'resting';
          obj.x = obj.crossFromX + (obj.crossSide === 'left' ? -80 : 80);
          obj.y = obj.crossFromY + (Math.random() - 0.5) * 80;
          obj.side = obj.crossSide;
          playTone(165, 1.0, 0.1, 'sine');
        }
      }
    }

    if (obj.state === 'arrived') {
      obj.arrivedOpacity -= 0.0003;
      if (obj.arrivedOpacity <= 0.05) {
        obj.state = 'resting';
        obj.arrivedOpacity = 1;
        playTone(261, 0.8, 0.1, 'sine');
        if (Math.random() < 0.4) spawnObject(obj.side);
      }
    }

    if (obj.state === 'lost') {
      obj.life -= 0.0008;
      if (obj.life <= 0) {
        objects.splice(objects.indexOf(obj), 1);
        if (Math.random() < 0.5) spawnObject(['left','right'][Math.floor(Math.random()*2)]);
      }
    }
  }

  // Motes
  for (const m of motes) {
    m.y -= m.speed;
    if (m.y < 0) { m.y = H; m.x = Math.random() * 20 - 10; }
  }

  updateWhispers(dt);
}

function dist(x1, y1, x2, y2) {
  return Math.sqrt((x2-x1)**2 + (y2-y1)**2);
}

function lerp(a, b, t) { return a + (b - a) * t; }

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

// ─── Draw ───
function drawHand(hand, t) {
  const bob = Math.sin(hand.bobPhase) * 1.5;
  const pushPulse = hand.pushing ? Math.sin(t * 0.05) * 3 : 0;
  const hx = hand.x;
  const hy = hand.y + bob;
  const hw = HAND_W + pushPulse;
  const hh = HAND_H;

  // Glow
  const glowColor = hand.side === 'left' ? 'rgba(160,200,255,0.15)' : 'rgba(255,200,160,0.15)';
  const glow = ctx.createRadialGradient(hx, hy, 0, hx, hy, hw * 3);
  glow.addColorStop(0, glowColor);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(hx, hy, hw * 3, 0, Math.PI * 2);
  ctx.fill();

  // Hand shape (simplified palm + fingers)
  ctx.save();
  ctx.translate(hx, hy);

  const col = hand.side === 'left' ? '#8ab4d4' : '#d4a882';
  ctx.fillStyle = col + 'cc';
  ctx.strokeStyle = col + '44';
  ctx.lineWidth = 0.5;

  // Palm
  ctx.beginPath();
  ctx.ellipse(0, 0, hw * 0.7, hh * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Fingers (4)
  for (let i = 0; i < 4; i++) {
    const angle = -0.5 + i * 0.33;
    const fx = Math.sin(angle) * hw * 0.5;
    const fy = -hh * 0.5 + Math.cos(angle) * hh * 0.15;
    ctx.beginPath();
    ctx.ellipse(fx, fy - hh * 0.15, hw * 0.18, hh * 0.28, angle, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  }

  // Thumb
  const thumbSide = hand.side === 'left' ? 1 : -1;
  ctx.beginPath();
  ctx.ellipse(thumbSide * hw * 0.5, -hh * 0.1, hw * 0.22, hh * 0.22, thumbSide * 0.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Held indicator
  if (hand.held) {
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(0, -hh * 0.5 - 8, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawObject(obj, t) {
  if (obj.state === 'lost') {
    const a = obj.life;
    ctx.globalAlpha = a * 0.4;
    ctx.fillStyle = `hsl(${obj.hue}, 60%, 60%)`;
    ctx.beginPath();
    ctx.arc(obj.x, obj.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    return;
  }

  if (obj.state !== 'arrived' && obj.state !== 'resting' && obj.state !== 'held' && obj.state !== 'crossing') return;

  let opacity = 1;
  if (obj.state === 'arrived') opacity = obj.arrivedOpacity;

  const pulse = Math.sin(obj.pulse) * 0.2 + 1;
  const r = 6 * pulse;
  const hue = obj.hue;

  // Glow
  ctx.globalAlpha = opacity * 0.4;
  const glow = ctx.createRadialGradient(obj.x, obj.y, 0, obj.x, obj.y, r * 4);
  glow.addColorStop(0, `hsl(${hue}, 70%, 75%)`);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(obj.x, obj.y, r * 4, 0, Math.PI * 2);
  ctx.fill();

  // Core
  ctx.globalAlpha = opacity;
  ctx.fillStyle = `hsl(${hue}, 70%, 70%)`;
  ctx.beginPath();
  ctx.arc(obj.x, obj.y, r, 0, Math.PI * 2);
  ctx.fill();

  // Bright center
  ctx.fillStyle = `hsl(${hue}, 60%, 90%)`;
  ctx.beginPath();
  ctx.arc(obj.x, obj.y, r * 0.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
}

function drawWindow(t) {
  const cx = CX();
  const w = WIN_W();
  const top = WIN_Y_TOP();
  const bot = WIN_Y_BOT();

  // Frame
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  ctx.strokeRect(cx - w / 2 - 1, top - 1, w + 2, bot - top + 2);

  // Frosted glass area
  const fogGrad = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
  fogGrad.addColorStop(0, 'rgba(200,210,230,0.04)');
  fogGrad.addColorStop(0.5, 'rgba(200,210,230,0.08)');
  fogGrad.addColorStop(1, 'rgba(200,210,230,0.04)');
  ctx.fillStyle = fogGrad;
  ctx.fillRect(cx - w / 2, top, w, bot - top);

  // Vertical lines (frost texture)
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 6; i++) {
    const lx = cx - w / 2 + (w / 5) * i;
    ctx.beginPath();
    ctx.moveTo(lx, top);
    ctx.lineTo(lx, bot);
    ctx.stroke();
  }

  // Floating dust motes in window
  for (const m of motes) {
    const mx = cx + m.x;
    const my = m.y;
    if (my < top || my > bot) continue;
    ctx.globalAlpha = m.opacity;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(mx, my, m.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Whisper text
  ctx.font = '11px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const w of activeWhispers) {
    ctx.globalAlpha = w.opacity;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(w.text, w.x, w.y);
  }
  ctx.globalAlpha = 1;
}

function drawSideGradient(side) {
  // Side ambient glow
  const cx = CX();
  const grad = ctx.createLinearGradient(
    side === 'left' ? 0 : cx,
    0,
    side === 'left' ? cx : W,
    0
  );
  const col = side === 'left' ? '0,10,20' : '20,10,0';
  grad.addColorStop(0, `rgba(${col}, 0.15)`);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
}

function render(t) {
  ctx.fillStyle = '#06060a';
  ctx.fillRect(0, 0, W, H);

  // Side glows
  drawSideGradient('left');
  drawSideGradient('right');

  // Floor shadow suggestion
  const floor = ctx.createLinearGradient(0, H * 0.8, 0, H);
  floor.addColorStop(0, 'rgba(0,0,0,0)');
  floor.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = floor;
  ctx.fillRect(0, 0, W, H);

  // Window
  drawWindow(t);

  // Objects behind hands
  for (const obj of objects) {
    drawObject(obj, t);
  }

  // Hands
  drawHand(leftHand, t);
  drawHand(rightHand, t);

  // Vignette
  const vig = ctx.createRadialGradient(W/2, H/2, H * 0.2, W/2, H/2, H * 0.9);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

// ─── Main Loop ───
let lastTime = 0;
let gameStarted = false;

function loop(t) {
  const dt = Math.min(t - lastTime, 50);
  lastTime = t;

  if (gameStarted) {
    update(dt, t);
    updateWhispers(dt);
  }
  render(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ─── Start ───
const titleScreen = document.getElementById('title-screen');
titleScreen.addEventListener('click', () => {
  titleScreen.classList.add('hidden');
  setTimeout(() => { titleScreen.style.display = 'none'; }, 2500);
  gameStarted = true;
  initAudio();
  startDrone();
  setTimeout(() => {
    const inst = document.getElementById('instructions');
    if (inst) inst.classList.add('fade');
  }, 8000);
  setTimeout(() => {
    const bh = document.getElementById('bottom-hint');
    if (bh) bh.style.opacity = '0';
  }, 15000);
});

// Touch support (two touch zones)
let touchLeft = null, touchRight = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  for (const touch of e.changedTouches) {
    if (touch.clientX < W / 2) {
      touchLeft = { id: touch.identifier, x: touch.clientX, y: touch.clientY };
      // Try grab
      const nearest = objects.find(o => o.state === 'resting' && o.side === 'left' && dist(touch.clientX, touch.clientY, o.x, o.y) < 60);
      if (nearest) { leftHand.held = nearest; nearest.state = 'held'; }
    } else {
      touchRight = { id: touch.identifier, x: touch.clientX, y: touch.clientY };
      const nearest = objects.find(o => o.state === 'resting' && o.side === 'right' && dist(touch.clientX, touch.clientY, o.x, o.y) < 60);
      if (nearest) { rightHand.held = nearest; nearest.state = 'held'; }
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touchLeft && touch.identifier === touchLeft.id) {
      leftHand.x = touch.clientX;
      leftHand.y = touch.clientY;
    }
    if (touchRight && touch.identifier === touchRight.id) {
      rightHand.x = touch.clientX;
      rightHand.y = touch.clientY;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touchLeft && touch.identifier === touchLeft.id) {
      if (leftHand.held) {
        const obj = leftHand.held;
        obj.state = 'crossing';
        obj.crossFromX = leftHand.x;
        obj.crossFromY = leftHand.y;
        obj.crossToX = CX() + 30;
        obj.crossToY = CY() + (Math.random() - 0.5) * 100;
        obj.crossProgress = 0;
        obj.crossSide = 'left';
        leftHand.held = null;
        playTone(180, 0.3, 0.15, 'triangle');
      } else {
        // Push back any object on left side
        const target = objects.find(o =>
          (o.state === 'arrived' || o.state === 'resting') &&
          o.side === 'left' &&
          dist(leftHand.x, leftHand.y, o.x, o.y) < 70
        );
        if (target) {
          target.state = 'crossing';
          target.crossFromX = target.x;
          target.crossFromY = target.y;
          target.crossToX = W * 0.85;
          target.crossToY = CY() + (Math.random() - 0.5) * 100;
          target.crossProgress = 0;
          target.crossSide = 'left';
          playTone(165, 0.4, 0.12, 'triangle');
        }
      }
      touchLeft = null;
    }
    if (touchRight && touch.identifier === touchRight.id) {
      if (rightHand.held) {
        const obj = rightHand.held;
        obj.state = 'crossing';
        obj.crossFromX = rightHand.x;
        obj.crossFromY = rightHand.y;
        obj.crossToX = CX() - 30;
        obj.crossToY = CY() + (Math.random() - 0.5) * 100;
        obj.crossProgress = 0;
        obj.crossSide = 'right';
        rightHand.held = null;
        playTone(180, 0.3, 0.15, 'triangle');
      } else {
        const target = objects.find(o =>
          (o.state === 'arrived' || o.state === 'resting') &&
          o.side === 'right' &&
          dist(rightHand.x, rightHand.y, o.x, o.y) < 70
        );
        if (target) {
          target.state = 'crossing';
          target.crossFromX = target.x;
          target.crossFromY = target.y;
          target.crossToX = W * 0.15;
          target.crossToY = CY() + (Math.random() - 0.5) * 100;
          target.crossProgress = 0;
          target.crossSide = 'right';
          playTone(165, 0.4, 0.12, 'triangle');
        }
      }
      touchRight = null;
    }
  }
}, { passive: false });
</script>
